<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un regalo para ti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    <div id="sparkles-container" class="sparkles-container"></div>

    <main class="scene">
        <p id="instruction" class="instruction">Toca el regalo para abrirlo</p>

        <div id="gift-wrapper" class="gift-wrapper">
            <!-- Osito de peluche ilustrado en SVG dentro de la caja -->
            <div id="teddy-bear" class="teddy-bear">
                <svg viewBox="0 0 220 240" class="bear-svg">
                    <!-- Orejas -->
                    <circle cx="62" cy="58" r="24" fill="#a47148" />
                    <circle cx="62" cy="58" r="13" fill="#d4a373" />
                    <circle cx="158" cy="58" r="24" fill="#a47148" />
                    <circle cx="158" cy="58" r="13" fill="#d4a373" />

                    <!-- Cuerpo -->
                    <ellipse cx="110" cy="168" rx="54" ry="58" fill="#a47148" />
                    <ellipse cx="110" cy="172" rx="34" ry="38" fill="#d4a373" />

                    <!-- Patitas inferiores -->
                    <ellipse cx="68" cy="212" rx="22" ry="16" fill="#8b5e34" />
                    <ellipse cx="68" cy="212" rx="13" ry="9" fill="#d4a373" />
                    <ellipse cx="152" cy="212" rx="22" ry="16" fill="#8b5e34" />
                    <ellipse cx="152" cy="212" rx="13" ry="9" fill="#d4a373" />

                    <!-- Cabeza -->
                    <circle cx="110" cy="95" r="48" fill="#b07d52" />

                    <!-- Hocico -->
                    <ellipse cx="110" cy="108" rx="21" ry="16" fill="#e6ccb2" />
                    <!-- Nariz -->
                    <ellipse cx="110" cy="102" rx="8" ry="5.5" fill="#3d2616" />
                    <!-- Sonrisa -->
                    <path d="M 101 113 Q 110 121 119 113" stroke="#3d2616" stroke-width="2.5" fill="none" stroke-linecap="round" />

                    <!-- Ojos brillantes -->
                    <circle cx="91" cy="87" r="5.5" fill="#1e130c" />
                    <circle cx="89" cy="85" r="2" fill="#ffffff" />
                    <circle cx="129" cy="87" r="5.5" fill="#1e130c" />
                    <circle cx="127" cy="85" r="2" fill="#ffffff" />

                    <!-- Mejillas sonrojadas -->
                    <ellipse cx="78" cy="101" rx="7" ry="4" fill="#f28482" opacity="0.55" />
                    <ellipse cx="142" cy="101" rx="7" ry="4" fill="#f28482" opacity="0.55" />

                    <!-- Corazón que sujeta el osito -->
                    <g class="held-heart">
                        <path d="M 110 198 C 110 198 62 166 62 137 C 62 120 76 110 90 110 C 100 110 107 116 110 123 C 113 116 120 110 130 110 C 144 110 158 120 158 137 C 158 166 110 198 110 198 Z" 
                              fill="#e63946" />
                        <!-- Brillo sutil del corazón -->
                        <path d="M 75 130 Q 80 120 90 120" stroke="#ff8fa3" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
                        <text x="110" y="154" text-anchor="middle" fill="#fff8f0" class="heart-text">Te amo</text>
                    </g>

                    <!-- Brazos abrazando el corazón -->
                    <ellipse cx="66" cy="154" rx="18" ry="13" transform="rotate(28 66 154)" fill="#8b5e34" />
                    <ellipse cx="154" cy="154" rx="18" ry="13" transform="rotate(-28 154 154)" fill="#8b5e34" />
                </svg>
            </div>

            <!-- Tapa de la caja con lazo -->
            <div id="gift-lid" class="gift-lid">
                <div class="bow">
                    <div class="bow-loop left"></div>
                    <div class="bow-loop right"></div>
                    <div class="bow-knot"></div>
                </div>
                <div class="lid-ribbon"></div>
            </div>

            <!-- Base de la caja -->
            <div class="gift-box">
                <div class="box-ribbon-vertical"></div>
                <div class="box-ribbon-horizontal"></div>
            </div>
        </div>

        <p id="final-caption" class="final-caption">Siempre contigo</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
